version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: flashloan-metrics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashloan
      POSTGRES_PASSWORD: flashloan
      POSTGRES_DB: flashloan_metrics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashloan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
