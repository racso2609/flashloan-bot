name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (fmt + build + unit tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      # The fork suites (ForkArbitrageTest) need a live RPC endpoint and are out of
      # scope for push/PR CI. FlashloanTest runs against mocks when SKIP_FORK=true,
      # except the four fork-only cases, which vm.skip() reports as skipped rather
      # than passing. Real coverage here: 8 passed + 4 skipped + 2 Counter tests.
      - name: Run unit tests (no RPC required)
        run: SKIP_FORK=true forge test --no-match-contract ForkArbitrage

  bot:
    name: Bot tests (node --test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Reads `packageManager` from bot/package.json, so the pinned pnpm version
      # (9.15.9) stays a single source of truth instead of being duplicated here.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: bot/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run bot tests
        run: pnpm test
